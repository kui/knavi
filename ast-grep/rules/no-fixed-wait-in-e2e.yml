id: no-fixed-wait-in-e2e
language: TypeScript
severity: error
message: |
  Do not sleep for a fixed time in E2E tests. Wait for something the extension
  does instead: a locator assertion, `expect.poll`, `page.waitForFunction`, or
  a DOM signal such as `knaviReady`. See dev-docs/testing.md.
files:
  - test/e2e/**
rule:
  any:
    - pattern: $PAGE.waitForTimeout($$$)
    - all:
        - any:
            - pattern: setTimeout($$$)
            - pattern: $G.setTimeout($$$)
            - pattern: await sleep($N)
            - pattern: await delay($N)
            - pattern: await wait($N)
            - pattern: await pause($N)
            - pattern: await timeout($N)
            - pattern: await $O.sleep($N)
            - pattern: await $O.delay($N)
            - pattern: await $O.wait($N)
            - pattern: await $O.pause($N)
            - pattern: await $O.timeout($N)
        - not:
            inside:
              # WHY: a bounded polling loop that re-checks its condition on each iteration is a legitimate wait (test/e2e/fixtures.ts).
              kind: while_statement
              stopBy: end
constraints:
  N:
    any:
      - kind: number
      - kind: identifier
