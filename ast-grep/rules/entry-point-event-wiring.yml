id: entry-point-event-wiring
language: TypeScript
severity: error
message: |
  Register event listeners on `chrome.*` events, `window`, `document`,
  `self`, `globalThis` and `navigation` only in the entry-point files. Export
  a handler from this module and wire it up in the entry point
  (src/background.ts, src/content-all.ts, src/content-root.ts,
  src/options.ts, src/popup.ts).
files:
  - src/**
ignores:
  - src/background.ts
  - src/content-all.ts
  - src/content-root.ts
  - src/options.ts
  - src/popup.ts
rule:
  any:
    - all:
        - pattern: $OBJ.addListener($$$)
        - has:
            field: function
            has:
              stopBy: end
              kind: identifier
              regex: ^chrome$
    - pattern: window.addEventListener($$$)
    - pattern: document.addEventListener($$$)
    - pattern: self.addEventListener($$$)
    - pattern: globalThis.addEventListener($$$)
    - pattern: navigation.addEventListener($$$)
    - pattern: navigation?.addEventListener($$$)
    - pattern: window.navigation.addEventListener($$$)
    - pattern: window.navigation?.addEventListener($$$)
    - pattern: addEventListener($$$)
